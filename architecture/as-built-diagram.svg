<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .box   { stroke: #000; stroke-width: 1.2; }
      .zone  { stroke: #666; stroke-width: 1.2; stroke-dasharray: 8 6; fill: #f5f5f5; }
      .t     { font-size: 15.5px; font-weight: bold; fill: #000; text-anchor: middle; }
      .lbl   { font-size: 15px; font-weight: bold; fill: #1f2a44; }
      .zlbl  { font-size: 14px; font-weight: bold; font-style: italic; fill: #1f2a44; }
      .hd    { font-size: 15.5px; font-weight: bold; fill: #000; }
      .note  { font-size: 13px; font-weight: bold; font-style: italic; fill: #000; }
      .line  { stroke: #000; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1070" fill="#ffffff"/>

  <text x="800" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" fill="#333">Operation Silent Dawn - CTF Platform &amp; Box Architecture (As Built)</text>

  <!-- Participant -->
  <rect class="box" x="400" y="95" width="800" height="92" rx="14" fill="#dae8fc"/>
  <text class="t" x="800" y="133">Participant Workstation - Kali Linux 2024.x (VirtualBox VM, NAT)</text>
  <text class="t" x="800" y="158">Audacity | exiftool | Burp Suite | Wireshark/tshark | Ghidra | GDB | Python 3</text>

  <!-- Zones -->
  <rect class="zone" x="40" y="285" width="760" height="600" rx="40"/>
  <text class="zlbl" x="72" y="313">Public Cloud - managed services (no intentionally vulnerable components)</text>

  <rect class="zone" x="840" y="470" width="720" height="415" rx="40"/>
  <text class="zlbl" x="872" y="498">Docker Host - Stage 3 owner's machine</text>

  <!-- Participant -> platform -->
  <path class="line" d="M640,187 L640,335" marker-end="url(#arrow)"/>
  <text class="lbl" x="625" y="245" text-anchor="end">HTTPS 443 - login, challenges, hints, flag submission</text>

  <!-- Participant -> Cloudflare -->
  <path class="line" d="M1100,187 L1100,300" marker-end="url(#arrow)"/>
  <text class="lbl" x="1115" y="250">HTTPS 443 - WEB-03 access link</text>

  <!-- Participant -> Google Drive -->
  <path class="line" d="M400,141 L20,141 L20,977 L80,977" marker-end="url(#arrow)"/>
  <text class="lbl" x="210" y="131" text-anchor="middle">HTTPS - signal_beta.wav download</text>

  <!-- Platform on Vercel -->
  <rect class="box" x="80" y="335" width="680" height="120" rx="14" fill="#dde6dd"/>
  <text class="t" x="420" y="372">Sentinel CTF Platform - ctf.janith.qzz.io (Vercel)</text>
  <text class="t" x="420" y="398">Authentication | Scoreboard | Challenges &amp; Hints | Flag Validation</text>
  <text class="t" x="420" y="424">Static frontend + 8 Node.js serverless functions | HMAC-SHA256 flag check</text>

  <!-- Platform -> Supabase -->
  <path class="line" d="M420,455 L420,540" marker-end="url(#arrow)"/>
  <rect x="196" y="484" width="448" height="24" fill="#f5f5f5"/>
  <text class="lbl" x="420" y="501" text-anchor="middle">Server side only - service-role key stays on the server</text>

  <!-- Supabase -->
  <rect class="box" x="80" y="540" width="680" height="320" rx="30" fill="#eef3fb"/>
  <text class="hd" x="112" y="570">Supabase (managed backend)</text>
  <text class="note" x="112" y="590">Row-level security on every table | no public policies</text>

  <rect class="box" x="105" y="605" width="300" height="100" rx="14" fill="#fff2cc"/>
  <text class="t" x="255" y="638">Supabase Auth</text>
  <text class="t" x="255" y="662">Email + password</text>
  <text class="t" x="255" y="686">Public sign-up disabled</text>

  <rect class="box" x="435" y="605" width="300" height="100" rx="14" fill="#d5e8d4"/>
  <text class="t" x="585" y="638">Postgres Database</text>
  <text class="t" x="585" y="662">Flags stored as HMAC only</text>
  <text class="t" x="585" y="686">Submissions + audit log</text>

  <rect class="box" x="105" y="725" width="630" height="118" rx="14" fill="#dae8fc"/>
  <text class="t" x="420" y="753">Private Storage Bucket - challenge-files</text>
  <text class="t" x="420" y="776">STEG-01 | OSINT-02 | NET-04 | CRYPTO-05 | REV-06</text>
  <text class="t" x="420" y="799">(WAV / archive / hex-dump / .enc / ELF binary)</text>
  <text class="t" x="420" y="822">Downloaded through 60-second signed links</text>

  <!-- Cloudflare -->
  <rect class="box" x="860" y="300" width="680" height="110" rx="14" fill="#ffe6cc"/>
  <text class="t" x="1200" y="335">Cloudflare Edge</text>
  <text class="t" x="1200" y="360">Quick tunnel - random trycloudflare.com address</text>
  <text class="t" x="1200" y="385">Address shown to signed-in players on the Stage 3 page</text>


  <!-- Challenge network -->
  <rect class="box" x="865" y="605" width="670" height="260" rx="30" fill="#ffe9e9"/>
  <rect x="893" y="621" width="400" height="20" fill="#ffe9e9"/>
  <text class="hd" x="895" y="637">Challenge Network - stage3_net (Docker bridge)</text>
  <text class="note" x="895" y="660">CPU 1.0 / 512 MB limit | non-root user | no-new-privileges</text>
  <text class="note" x="895" y="678">unless-stopped restart policy</text>

  <rect class="box" x="980" y="512" width="440" height="70" rx="14" fill="#dae8fc"/>

  <!-- Cloudflare <-> cloudflared -->
  <path class="line" d="M1340,410 L1340,512" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="1180" y="428" width="320" height="24" fill="#ffffff"/>
  <text class="lbl" x="1340" y="445" text-anchor="middle">Outbound-only tunnel from cloudflared</text>
  <text class="t" x="1200" y="541">cloudflared (quick tunnel)</text>
  <text class="t" x="1200" y="565">Forwards to http://localhost:8080</text>

  <path class="line" d="M1340,582 L1340,715" marker-end="url(#arrow)"/>

  <rect class="box" x="980" y="715" width="440" height="110" rx="14" fill="#fff2cc"/>
  <text class="t" x="1200" y="750">WEB-03 Container - stage3-staging-drop</text>
  <text class="t" x="1200" y="775">Python/Flask + SQLite - port 8080</text>
  <text class="t" x="1200" y="800">(WAF bypass + IDOR challenge)</text>

  <!-- External file host -->
  <rect class="box" x="80" y="925" width="680" height="105" rx="14" fill="#e1d5e7"/>
  <text class="t" x="420" y="960">External File Host</text>
  <text class="t" x="420" y="984">Google Drive - serves signal_beta.wav for STEG-01</text>
  <text class="t" x="420" y="1008">(link decoded from signal_alpha.wav metadata)</text>

  <!-- Reset -->
  <rect class="box" x="880" y="925" width="640" height="105" rx="14" fill="#f4ffe0"/>
  <text class="t" x="1200" y="960">Reset / Recovery</text>
  <text class="t" x="1200" y="984">Platform: Sentinel Control - Full reset | WEB-03: docker compose down / up</text>
  <text class="t" x="1200" y="1008">Static stages: rebuilt by their build scripts</text>
</svg>
